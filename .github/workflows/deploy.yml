name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          node --test .github/scripts/wait-for-pages.test.cjs

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # A branch-based Pages site also runs GitHub's Jekyll deployment.
      # Publish the Vite artifact after it, so source HTML cannot overwrite it.
      - name: Wait for branch-based Pages deployment
        id: pages_ready
        timeout-minutes: 20
        uses: actions/github-script@v7
        with:
          script: |
            const waitForPages = require('./.github/scripts/wait-for-pages.cjs')
            return await waitForPages({ github, context, core })

      - name: Deploy to GitHub Pages
        if: steps.pages_ready.outputs.result == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
